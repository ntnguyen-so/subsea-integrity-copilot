<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="topology-title topology-desc">
<title id="topology-title">Synthetic Y-shaped pipeline network with 24 sensor nodes</title>
<desc id="topology-desc">P1 connects to P2 and P3. Each segment is 800 metres with four stations at 100, 300, 500 and 700 metres. Each station has A and B sensors eight metres on either side. This is a topology schematic, not a geographic scale drawing; offsets are exaggerated.</desc>
<rect x="1" y="1" width="898" height="198" rx="7" fill="#f4f8fa" stroke="#c4d5dd"/>
<g font-family="Arial,sans-serif" fill="#173c4b">
<g data-segment-id="P1" data-length-m="800" data-start-x="0" data-start-y="0" data-end-x="800" data-end-y="0">
<path d="M45 91 L405 91" fill="none" stroke="#5e7a89" stroke-width="4"/>
<text x="185" y="50" font-size="20" font-weight="700">P1 / 800m</text>
<circle cx="90.00" cy="97.00" r="4.2" fill="#136d7d" stroke="#fff" stroke-width=".6" data-sensor-id="P1-ST1-A" data-station-id="P1-ST1" data-segment-id="P1" data-chainage-m="100" data-failure-domain="gateway-P1-0" data-source-x="100" data-source-y="-8"><title>P1-ST1-A; 100m; gateway-P1-0</title></circle>
<circle cx="90.00" cy="85.00" r="4.2" fill="#759fd5" stroke="#fff" stroke-width=".6" data-sensor-id="P1-ST1-B" data-station-id="P1-ST1" data-segment-id="P1" data-chainage-m="100" data-failure-domain="gateway-P1-0" data-source-x="100" data-source-y="8"><title>P1-ST1-B; 100m; gateway-P1-0</title></circle>
<circle cx="180.00" cy="97.00" r="4.2" fill="#136d7d" stroke="#fff" stroke-width=".6" data-sensor-id="P1-ST2-A" data-station-id="P1-ST2" data-segment-id="P1" data-chainage-m="300" data-failure-domain="gateway-P1-1" data-source-x="300" data-source-y="-8"><title>P1-ST2-A; 300m; gateway-P1-1</title></circle>
<circle cx="180.00" cy="85.00" r="4.2" fill="#759fd5" stroke="#fff" stroke-width=".6" data-sensor-id="P1-ST2-B" data-station-id="P1-ST2" data-segment-id="P1" data-chainage-m="300" data-failure-domain="gateway-P1-1" data-source-x="300" data-source-y="8"><title>P1-ST2-B; 300m; gateway-P1-1</title></circle>
