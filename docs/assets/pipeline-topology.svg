<circle cx="701.04" cy="10.80" r="4.2" fill="#759fd5" stroke="#fff" stroke-width=".6" data-sensor-id="P2-ST4-B" data-station-id="P2-ST4" data-segment-id="P2" data-chainage-m="700" data-failure-domain="gateway-P2-1" data-source-x="1355.2" data-source-y="426.4"><title>P2-ST4-B; 700m; gateway-P2-1</title></circle>
