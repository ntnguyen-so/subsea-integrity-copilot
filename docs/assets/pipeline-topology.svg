<circle cx="270.00" cy="85.00" r="4.2" fill="#759fd5" stroke="#fff" stroke-width=".6" data-sensor-id="P1-ST3-B" data-station-id="P1-ST3" data-segment-id="P1" data-chainage-m="500" data-failure-domain="gateway-P1-0" data-source-x="500" data-source-y="8"><title>P1-ST3-B; 500m; gateway-P1-0</title></circle>
<circle cx="360.00" cy="97.00" r="4.2" fill="#136d7d" stroke="#fff" stroke-width=".6" data-sensor-id="P1-ST4-A" data-station-id="P1-ST4" data-segment-id="P1" data-chainage-m="700" data-failure-domain="gateway-P1-1" data-source-x="700" data-source-y="-8"><title>P1-ST4-A; 700m; gateway-P1-1</title></circle>
