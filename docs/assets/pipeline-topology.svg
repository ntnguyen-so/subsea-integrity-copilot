<text x="90" y="120" text-anchor="middle" font-size="17">100m</text>
<text x="180" y="120" text-anchor="middle" font-size="17">300m</text>
<text x="270" y="120" text-anchor="middle" font-size="17">500m</text>
<text x="360" y="120" text-anchor="middle" font-size="17">700m</text>
</g>
