# Python service/runtime and packaged prompt assets; uv.lock pins resolved versions.
[project]
name = "subsea-copilot"
version = "0.1.0"
description = "Read-only synthetic subsea integrity monitoring and governed investigation demo"
requires-python = ">=3.11,<3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.1",
    "langchain-core>=1,<2",
    "langgraph>=1.2.15,<1.3",
    "langgraph-checkpoint-postgres>=3.1.3,<4",
    "numpy>=2,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.14.1",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
subsea = "subsea_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

# Offline tests are the default verification path. Integration/live cases declare
# their external-service needs rather than silently making hosted model calls.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--allow-hosts=127.0.0.1,::1"]
markers = [
    "integration: requires independently bootstrapped PostgreSQL",
    "live: explicitly enabled synthetic Copilot inference",
]
xfail_strict = true
